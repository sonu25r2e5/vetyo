<svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- White background -->
<rect width="20" height="20" fill="white"/>
<!-- Union Jack simplified: Blue background with red cross -->
<rect width="20" height="20" fill="#002395"/>
<!-- Red cross -->
<rect x="0" y="8" width="20" height="4" fill="#E8102E"/>
<rect x="8" y="0" width="4" height="20" fill="#E8102E"/>
<!-- White cross borders -->
<rect x="0" y="9" width="20" height="2" fill="white"/>
<rect x="9" y="0" width="2" height="20" fill="white"/>
</svg>
