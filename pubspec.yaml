name: vetyo
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.7.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  get_it: ^9.2.0
  equatable: ^2.0.8
  bloc: ^9.2.0
  dio: ^5.9.0
  logger: ^2.6.2
  chucker_flutter: ^1.9.1
  dartz: ^0.10.1
  file_picker: ^8.0.0
  image_picker: ^1.2.1
  flutter_bloc: ^9.1.1
  iconoir_flutter: ^7.11.0
  google_sign_in: ^7.2.0
  jp_prefecture: ^2.0.0
  flutter_facebook_auth: ^7.1.5
  device_preview: ^1.2.0
  url_launcher: ^6.3.2
  pinput: ^6.0.1
  flutter_native_splash: ^2.4.4
  carousel_slider: ^5.0.0
  smooth_page_indicator: ^1.2.0+3
  # Missing dependencies that were causing issues:
  flutter_svg: ^2.0.10
  intl: ^0.20.2
  shared_preferences: ^2.3.5
  http_parser: ^4.0.2
  flutter_localizations:
    sdk: flutter
  dotted_border: ^2.1.0
  flutter_launcher_icons: ^0.14.4
  flutter_tts: ^4.2.5
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter_native_splash:
  color: "#f3f4f8"
  image_ios: assets/images/app_splash.png
  image: assets/images/app_splash.png
  icon_background_color: "#f3f4f8"
  color_android: "#f3f4f8"
  color_ios: "#f3f4f8"
  branding_mode: center

  android_12:
    color: "#f3f4f8"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/l10n/
  fonts:
    - family: Satoshi
      fonts:
        - asset: assets/fonts/Satoshi-Light.otf
          weight: 300
        - asset: assets/fonts/Satoshi-Regular.otf
          weight: 400
        - asset: assets/fonts/Satoshi-Medium.otf
          weight: 500
        - asset: assets/fonts/Satoshi-Bold.otf
          weight: 700
        - asset: assets/fonts/Satoshi-Black.otf
          weight: 900

    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2-Regular.ttf
          weight: 400
        - asset: assets/fonts/Baloo2-Medium.ttf
          weight: 500
        - asset: assets/fonts/Baloo2-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Baloo2-Bold.ttf
          weight: 700
        - asset: assets/fonts/Baloo2-ExtraBold.ttf
          weight: 800
